name: Expo support validation

on:
  pull_request:
  push:
    branches: [master]

jobs:
  javascript-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:plugin
      - run: npm test -- --runInBand
      - run: npm pack --dry-run

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: ./gradlew test verifyExpo57RuntimeDependencies assembleDebug --no-daemon --console=plain
        working-directory: android
